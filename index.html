<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контракты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Ruslan+Display&family=PT+Mono&display=swap" rel="stylesheet">
<style>
/*
VOICE: тишина, холод, чужой кабинет ночью; кто-то рядом
IDEA: вид сверху на стол под умирающей лампой; потом тусклый свет
PICTURE: тёмное дерево, стопка белых листов «Контракты», затем 6 листов в тусклом свете
COLOUR and TYPE: почти чёрный, тёмный орех, холодная белая бумага; Old Standard TT, PT Mono
LAYOUT: один экран без прокрутки
*/
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:"PT Mono",monospace}

.scene{position:fixed;inset:0;overflow:hidden;background:#0b0705}
.cam{position:absolute;inset:0;animation:sway 23s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translate(0,0) rotate(0)}30%{transform:translate(-4px,3px) rotate(.12deg)}62%{transform:translate(3px,-2px) rotate(-.1deg)}}
.world{position:absolute;inset:0;transform-origin:50% 50%}
.wood{position:absolute;left:-50%;top:-50%;width:200%;height:200%}

/* свет */
.dark{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 62% 58% at var(--lx,50%) var(--ly,48%),rgba(0,0,0,.15) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.93) 78%,#000 100%)}
.warm{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
  background:radial-gradient(ellipse 45% 42% at var(--lx,50%) var(--ly,48%),rgba(235,205,120,.35),rgba(0,0,0,0) 70%)}
.dim .dark{background:radial-gradient(ellipse 72% 68% at var(--lx,50%) var(--ly,50%),rgba(0,0,0,.42) 0%,rgba(0,0,0,.66) 48%,rgba(0,0,0,.94) 84%,#000 100%)}
.dim .warm{background:radial-gradient(ellipse 52% 48% at var(--lx,50%) var(--ly,50%),rgba(255,190,120,.2),rgba(0,0,0,0) 72%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:overlay;width:100%;height:100%}
.flick{position:absolute;inset:0;background:#000;pointer-events:none;opacity:1}
/* проклятие: больной цвет, красные края, живое зерно, тень, сердцебиение */
.curse{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
  background:radial-gradient(ellipse 70% 65% at 50% 50%,rgba(255,255,255,1) 32%,rgba(175,70,60,1) 62%,rgba(110,10,5,1) 90%)}
.sick{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color;background:#5d5a3c;opacity:.18}
.grain{animation:grain .9s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.beat{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 60% 55% at 50% 50%,rgba(0,0,0,0) 30%,rgba(40,0,0,.75) 80%,#000 100%)}
.figure{position:absolute;left:0;top:0;width:70vmax;height:70vmax;pointer-events:none;opacity:0;filter:blur(38px);
  background:radial-gradient(ellipse 16% 19% at 50% 30%,rgba(0,0,0,.95) 60%,rgba(0,0,0,0) 100%),
             radial-gradient(ellipse 46% 30% at 50% 72%,rgba(0,0,0,.95) 55%,rgba(0,0,0,0) 100%)}
.redflash{position:absolute;inset:0;pointer-events:none;background:#3a0000;mix-blend-mode:multiply;opacity:0}
.word{transition:text-shadow .1s}
.word.glitch{text-shadow:2px 0 rgba(150,0,0,.75),-2px 0 rgba(0,70,70,.45);transform:skewX(-6deg)}
.word{display:inline-block;text-shadow:0 0 1px rgba(30,0,0,.6)}

/* стопка */
.stack{--w:min(46vmin,420px);position:absolute;left:50%;top:50%;width:var(--w);aspect-ratio:1/1.414;
  transform:translate(-50%,-50%) rotate(-3deg);cursor:pointer;border:0;padding:0;background:none}
.stack:focus-visible{outline:1px solid rgba(220,200,160,.4);outline-offset:14px}
.sheet{position:absolute;inset:0;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.4)}
.sheet:nth-child(2){transform:translate(14px,12px) rotate(4deg);background:#c9c7c0}
.sheet:nth-child(3){transform:translate(-10px,8px) rotate(-3deg);background:#d3d1ca}
.sheet:nth-child(4){transform:translate(8px,-4px) rotate(2deg);background:#dbd9d3}
.sheet:nth-child(5){transform:translate(-4px,3px) rotate(-1deg);background:#e0ded8}
.shadow{position:absolute;inset:4% -6% -8% 8%;background:rgba(0,0,0,.85);filter:blur(22px);border-radius:8px;translate:var(--sx,0px) var(--sy,0px)}

.page{position:absolute;inset:0;--c:0px;--k:0}
.face{position:absolute;inset:0;border-radius:2px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 82% 88%,rgba(60,55,45,.10),transparent 40%),linear-gradient(170deg,#f2f1ed,#e6e5e0 60%,#d9d8d2);
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%);
  transform:translate(calc(var(--k) * -2px),calc(var(--k) * -3px))}
.face::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.6%,rgba(0,0,0,.07) 50%,transparent 50.4%)}
.word{font-family:"Old Standard TT",serif;font-weight:700;font-size:clamp(20px,5.4vmin,48px);letter-spacing:.08em;color:#141210}
.lift{position:absolute;right:0;bottom:0;width:calc(var(--c) * 1.35);height:calc(var(--c) * 1.35);pointer-events:none;
  background:radial-gradient(circle at 100% 100%,rgba(0,0,0,.45),rgba(0,0,0,0) 70%);opacity:var(--k)}
.flapwrap{position:absolute;right:0;bottom:0;width:var(--c);height:var(--c);filter:drop-shadow(-7px -8px 9px rgba(0,0,0,.5))}
.flap{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,0 100%);
  background:radial-gradient(circle at 0 0,#f6f5f1 0,#e3e2dc 38%,#b9b7b0 62%,#8d8b85 72%,rgba(0,0,0,0) 72.5%),
             linear-gradient(135deg,#8f8e89,#c9c7c1 40%,#efeee9 50%,#c2c0ba)}

/* 6 листов */
.doc{position:absolute;left:0;top:0;aspect-ratio:1/1.414;border:0;padding:0;border-radius:2px;cursor:pointer;
  background:linear-gradient(170deg,#f2f1ed,#e6e5e0 60%,#d9d8d2);
  box-shadow:calc(10px + var(--sx,0px)) calc(16px + var(--sy,0px)) 26px rgba(0,0,0,.75),0 1px 0 rgba(0,0,0,.4);will-change:transform;opacity:0}
.doc.placed{transition:box-shadow 1.1s cubic-bezier(.25,.1,.25,1),translate 1.1s cubic-bezier(.25,.1,.25,1)}
.doc.placed:hover{translate:0 -5px;box-shadow:20px 32px 40px rgba(0,0,0,.82),0 1px 0 rgba(0,0,0,.4)}
.doc:focus-visible{outline:1px solid rgba(220,200,160,.5);outline-offset:8px}



/* кровавые надписи */
.blood{display:block;width:100%;height:auto;overflow:visible}
.blood text{font-family:"Ruslan Display","Old Standard TT",serif}
@keyframes drip{to{stroke-dashoffset:0}}
@keyframes dropin{from{opacity:0}to{opacity:1}}
.doc .dt{position:absolute;left:7%;right:7%;top:37%;pointer-events:none}

/* открытый контракт: лист поднят со стола, стол виден за ним */
.contract{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:rgba(0,0,0,0);transition:background 1.4s ease,backdrop-filter 1.4s ease}
.contract.on{background:rgba(8,0,0,.22);backdrop-filter:blur(2px) saturate(.75)}
.paper{position:relative;width:min(92vw,62vh);aspect-ratio:1/1.414;max-height:94vh;container-type:inline-size;border-radius:2px;overflow:hidden;
  background:radial-gradient(ellipse at 84% 94%,rgba(80,15,5,.16),transparent 38%),radial-gradient(ellipse at 6% 4%,rgba(60,40,20,.08),transparent 30%),linear-gradient(170deg,#f2f1ed,#e8e7e2 60%,#dcdbd5);
  box-shadow:0 50px 90px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.25);transform-origin:50% 50%}
.paper.held{animation:hold 9s ease-in-out infinite}
@keyframes hold{0%,100%{translate:0 0;scale:1}35%{translate:-3px 4px;scale:1.004}70%{translate:2px -2px;scale:.998}}
.pbody{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:5cqw 8cqw 4cqw;color:#1c1712;display:flex;flex-direction:column;
  font-family:"PT Mono",monospace;font-size:max(10px,2.25cqw);line-height:1.5;opacity:0;scrollbar-width:thin;scrollbar-color:rgba(90,10,0,.45) transparent}
.pbody.show{opacity:1;transition:opacity 1.1s ease .1s}
.pno{text-align:center;font-size:.85em;letter-spacing:.4em;color:#4a4038}
.ptitle{width:66cqw;margin:1.5cqw auto 0}
.pdate{text-align:center;font-size:.9em;letter-spacing:.12em;color:#3a2f27;margin:1.5cqw 0 3.5cqw}
.pdate b{font-weight:400;color:#6e0302}
.cl{margin:0 0 1cqw;display:flex;gap:2.2cqw}
.cl>span:first-child{flex:none;color:#6e0302}
.give,.get{margin:2.4cqw 0 1.2cqw}
.signbtn{align-self:center;margin-top:3cqw;min-height:40px;padding:1cqw 7cqw;border:1.5px solid #6e0302;background:transparent;color:#6e0302;
  font:700 max(12px,2.4cqw) "PT Mono",monospace;letter-spacing:.35em;cursor:pointer;border-radius:2px;transition:background .4s,color .4s,opacity .4s,box-shadow .4s}
.signbtn:disabled{opacity:.28;cursor:default}
.signbtn:not(:disabled):hover{background:#6e0302;color:#f2f1ed;box-shadow:0 0 18px rgba(110,3,2,.45)}
.signbtn:focus-visible{outline:2px solid #6e0302;outline-offset:3px}
.redline{flex:1;display:grid;gap:.25em;padding:.15em 0}
.redline b{display:block;height:1.2em;background:linear-gradient(180deg,#120705,#0a0605 45%,#1a0604);box-shadow:0 0 1px #3a0000,0 0 3px rgba(90,0,0,.45)}
.pad{position:relative;flex:1 1 26cqw;min-height:22cqw;border:1px dashed rgba(90,10,0,.45);background:rgba(120,20,10,.03);border-radius:2px}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pad .ph{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:rgba(70,20,10,.45);font-size:.9em;text-align:center;padding:0 6%;transition:opacity .4s}
.pad.inked .ph{opacity:0}
.erase{position:absolute;right:6px;bottom:6px;min-height:30px;padding:3px 10px;border:1px solid rgba(70,20,10,.3);background:rgba(242,241,237,.85);color:#4a1a10;
  font:.8em "PT Mono",monospace;cursor:pointer;border-radius:2px;opacity:0;transition:opacity .3s}
.pad.inked .erase{opacity:1}
.erase:focus-visible{outline:2px solid #6a0a00;opacity:1}
.get .red{color:#7a0a06}
.signrow{display:grid;grid-template-columns:minmax(0,38cqw) minmax(0,1fr);gap:3cqw;align-items:end;margin-top:1.5cqw}
.signlbl{padding-bottom:1cqw}
.sign{flex:none;height:13cqw;min-height:13cqw;border:0;border-bottom:1.5px solid #1c1712;background:none}
/* машинка: каждая буква чуть сбита */
.w{white-space:nowrap;display:inline-block}
.w i{font-style:normal;display:inline-block;transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg));opacity:var(--o,1);transition:transform .5s cubic-bezier(.2,.8,.2,1),color 2s}
.w i.blot{text-shadow:0 0 .5px currentColor,.3px .2px 0 currentColor}
.w i.bled{color:#7a0a06}
.w.mirror{transform:scaleX(-1)}
.pbody.shiver{filter:blur(.6px);translate:1px 0}
.pclose{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;z-index:5;min-height:44px;padding:8px 14px;border:1px solid rgba(220,200,180,.25);background:rgba(0,0,0,.5);
  color:#c9bfb2;font:13px "PT Mono",monospace;letter-spacing:.2em;cursor:pointer;opacity:0;transition:opacity .8s;border-radius:2px}
.contract.on .pclose{opacity:1}
.pclose:focus-visible{outline:1px solid #c9bfb2}

/* зачёрканное поле */
.redact{position:relative;flex:0 0 15cqw;min-height:0;margin-top:.5cqw}
.redact svg{position:absolute;inset:-4% -2%;width:104%;height:108%}
/* печать */
.stamp{position:fixed;left:0;top:0;z-index:7;width:clamp(78px,11vmin,110px);aspect-ratio:1;border:0;padding:0;background:none;cursor:grab;touch-action:none;opacity:0}
.stamp .knob{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#6b4a33 0,#3b2517 38%,#1d120b 70%,#0d0805 100%);
  box-shadow:inset -6px -8px 14px rgba(0,0,0,.7),inset 4px 5px 8px rgba(255,220,180,.12),0 0 0 3px #120b07,0 0 0 6px #4a1410}
.stamp .knob::after{content:"";position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#55392a,#1a0f09);box-shadow:inset -2px -3px 5px rgba(0,0,0,.6)}
.stamp .sh{position:absolute;inset:6%;border-radius:50%;background:rgba(0,0,0,.75);filter:blur(10px);transform:translate(12px,18px);z-index:-1;transition:transform .25s}
.stamp.held{cursor:grabbing}
.stamp.held .sh{transform:translate(28px,40px) scale(1.1);filter:blur(16px)}
.stamp:focus-visible{outline:1px solid #c9bfb2;outline-offset:6px;border-radius:50%}
.grip{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;transition:opacity 1.4s ease;
  background:radial-gradient(ellipse 52% 48% at 50% 50%,rgba(0,0,0,0) 18%,rgba(70,0,0,.55) 52%,rgba(15,0,0,.94) 78%,#000 100%)}
.grip.on{opacity:1}
.mark{position:absolute;width:34cqw;aspect-ratio:1;pointer-events:none;mix-blend-mode:multiply;opacity:.9;z-index:2}
.burn,.glow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.glow{filter:blur(7px) brightness(1.6);mix-blend-mode:screen;z-index:4}
.sparks{position:fixed;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}
.ash{position:absolute;left:0;top:0;aspect-ratio:1/1.414;pointer-events:none;
  background:radial-gradient(ellipse 50% 44% at 50% 52%,rgba(3,2,1,.97),rgba(8,5,3,.9) 38%,rgba(22,12,6,.6) 60%,rgba(40,20,10,.22) 74%,transparent 84%)}
.ash::before{content:"";position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle,rgba(255,90,20,.35),transparent 60%);filter:blur(6px);animation:smolder 3.4s ease-in-out infinite}
@keyframes smolder{0%,100%{opacity:.25}50%{opacity:.8}}
.ash::after{content:"";position:absolute;inset:20%;background:radial-gradient(circle at 30% 40%,rgba(140,130,120,.5) 0 3%,transparent 4%),radial-gradient(circle at 62% 58%,rgba(140,130,120,.45) 0 2.5%,transparent 3.5%),radial-gradient(circle at 70% 30%,rgba(120,110,100,.4) 0 2%,transparent 3%),radial-gradient(circle at 38% 70%,rgba(130,120,110,.4) 0 2.2%,transparent 3.2%),radial-gradient(circle at 48% 30%,rgba(255,110,30,.5) 0 .8%,transparent 1.6%)}

.dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
.w i.hid{opacity:0!important}
.stamp .knob{animation:bob 2.6s ease-in-out infinite}
.stamp .sh{animation:bobsh 2.6s ease-in-out infinite}
@keyframes bob{50%{translate:0 -5px}}
@keyframes bobsh{50%{scale:.9;opacity:.8}}
.stamp.held .knob{animation:tremble .09s steps(2) infinite}
.stamp.held .sh{animation:none}
@keyframes tremble{0%{translate:.8px -.6px}50%{translate:-.9px .7px}100%{translate:.5px .9px}}
.pad.sign canvas{filter:drop-shadow(0 0 .6px rgba(110,3,2,.7))}
/* мини-текст на листе, лежащем на столе */
.doc .mini{position:absolute;left:12%;right:12%;top:60%;display:grid;gap:5%;height:28%;pointer-events:none}
.doc .mini span{display:block;height:1.5px;background:rgba(30,20,15,.32)}
.doc .dno{position:absolute;left:0;right:0;top:27%;text-align:center;font:max(6px,.5vmin) "PT Mono",monospace;letter-spacing:.3em;color:rgba(30,20,15,.5);pointer-events:none}
@media(max-width:600px){.signrow{grid-template-columns:minmax(0,1fr)}.sign{height:22cqw;min-height:22cqw}}
@media(max-aspect-ratio:3/4){.stack{--w:min(70vw,420px)}}
@media(prefers-reduced-motion:reduce){.cam,.grain{animation:none}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="cam">
    <div class="world" id="world">
      <svg class="wood" preserveAspectRatio="none" viewBox="0 0 1000 1000" aria-hidden="true">
        <filter id="w" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.004 0.09" numOctaves="4" seed="7"/>
          <feColorMatrix values="0 0 0 0 .13  0 0 0 0 .075  0 0 0 0 .04  0 0 0 -1.2 .9"/>
        </filter>
        <rect width="1000" height="1000" fill="#140c07"/>
        <rect width="1000" height="1000" filter="url(#w)"/>
        <g stroke="#060302" stroke-width="2" opacity=".7"><line x1="0" y1="250" x2="1000" y2="250"/><line x1="0" y1="375" x2="1000" y2="375"/><line x1="0" y1="510" x2="1000" y2="510"/><line x1="0" y1="645" x2="1000" y2="645"/><line x1="0" y1="770" x2="1000" y2="770"/></g>
      </svg>
      <div id="docs"></div>
      <button class="stack" id="stack" aria-label="Контракты">
        <div class="shadow"></div>
        <div class="sheet"></div><div class="sheet"></div><div class="sheet"></div><div class="sheet"></div>
        <div class="page" id="page">
          <div class="lift"></div>
          <div class="face"><span class="word">КОНТРАКТЫ</span></div>
          <div class="flapwrap"><div class="flap"></div></div>
        </div>
      </button>
    </div>
  </div>
  <div class="figure" id="figure"></div>
  <div class="sick"></div>
  <div class="curse"></div>
  <div class="beat" id="beat"></div>
  <svg class="grain" style="inset:-5%;width:110%;height:110%" aria-hidden="true"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  <div class="dark"></div>
  <div class="warm" id="warm"></div>
  <div class="redflash" id="redflash"></div>
  <canvas class="dust" id="dust"></canvas>
  <div class="flick" id="flick"></div>
</div>

<script>
{
const $=id=>document.getElementById(id);
const scene=$('scene'),world=$('world'),stack=$('stack'),page=$('page'),docsBox=$('docs'),flick=$('flick'),warm=$('warm');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a);
const Z=.72;

/* ================= ЗВУК ================= */
let ac=null,master,amb,droneLP,droneG,hiG,started=false;
function noiseBuf(sec,brown){
  const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);let last=0;
  for(let i=0;i<n;i++){const w=Math.random()*2-1;if(brown){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w}
  return b;
}
function initAudio(){
  try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;
  master=ac.createGain();master.gain.value=0;master.connect(comp).connect(ac.destination);
  amb=ac.createGain();amb.gain.value=.12;amb.connect(master);
  const t=ac.currentTime;
  /* низкий гул: близкие частоты бьются друг о друга */
  droneLP=ac.createBiquadFilter();droneLP.type='lowpass';droneLP.frequency.value=150;droneLP.Q.value=7;
  droneG=ac.createGain();droneG.gain.value=.42;droneLP.connect(droneG).connect(amb);
  const lfo=ac.createOscillator(),lfoG=ac.createGain();lfo.frequency.value=.045;lfoG.gain.value=55;lfo.connect(lfoG).connect(droneLP.frequency);lfo.start();
  [[48.9,'sine',.9],[49.55,'sine',.9],[97.6,'sawtooth',.22],[69.3,'triangle',.25]].forEach(([f,ty,g])=>{const o=ac.createOscillator(),gg=ac.createGain();o.type=ty;o.frequency.value=f;gg.gain.value=g;o.connect(gg).connect(droneLP);o.start()});
  /* тонкий неприятный звон (полутон) */
  hiG=ac.createGain();hiG.gain.value=.005;hiG.connect(amb);
  [1567,1661,2349.6].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=i===2?.4:1;o.connect(g).connect(hiG);o.start()});
  const tr=ac.createOscillator(),trG=ac.createGain();tr.frequency.value=.21;trG.gain.value=.004;tr.connect(trG).connect(hiG.gain);tr.start();

const dust=$('dust'),dx=dust.getContext('2d'),cam=document.querySelector('.cam');
let motes=[],pmx=0,pmy=0,ptx=0,pty=0,lastF=0;

function life(now){
  requestAnimationFrame(life);

  const t=now/1000;
  /* лампа висит и медленно качается */
  const lx=50+Math.sin(t*.37)*2.2+Math.sin(t*.13)*1,ly=(scene.classList.contains('dim')?50:48)+Math.cos(t*.29)*1.4;
  const st=scene.style;
  if(!reduce){st.setProperty('--lx',lx.toFixed(2)+'%');st.setProperty('--ly',ly.toFixed(2)+'%');
    st.setProperty('--sx',((50-lx)*2.2).toFixed(1)+'px');st.setProperty('--sy',((48-ly)*2.2).toFixed(1)+'px');
    warm.style.opacity=(.88+Math.sin(t*1.7)*.06+Math.sin(t*4.3)*.03).toFixed(3);
    /* камера чуть следует за взглядом */

  /* пыль, видна только в луче */
  dx.clearRect(0,0,innerWidth,innerHeight);
  const cx=innerWidth*lx/100,cy=innerHeight*ly/100,R=Math.min(innerWidth,innerHeight)*.55;
  for(const m of motes){
    if(!reduce){m.x+=m.vx+Math.sin(t*.4+m.ph)*.05;m.y+=m.vy+Math.cos(t*.33+m.ph)*.04;
      if(m.x<-5)m.x=innerWidth+5;if(m.x>innerWidth+5)m.x=-5;if(m.y<-5)m.y=innerHeight+5;if(m.y>innerHeight+5)m.y=-5}
    const d=Math.hypot(m.x-cx,m.y-cy)/R;if(d>1)continue;
    const a=(1-d)*(1-d)*(.35+.25*Math.sin(t*1.3+m.ph));
    dx.fillStyle=`rgba(255,225,180,${a.toFixed(3)})`;dx.beginPath();dx.arc(m.x,m.y,m.r,0,7);dx.fill();
  }
}

/* ===== сгорание ===== */
function vnoise(gw,gh,cell){
  const nx=Math.ceil(gw/cell)+2,ny=Math.ceil(gh/cell)+2,g=Array.from({length:nx*ny},()=>Math.random());
  return (x,y)=>{const fx=x/cell,fy=y/cell,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);
    const a=g[iy*nx+ix],b=g[iy*nx+ix+1],c=g[(iy+1)*nx+ix],d=g[(iy+1)*nx+ix+1];return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy};
}
function fireSound(dur){

  wb.frequency.setValueAtTime(150,t);wb.frequency.exponentialRampToValueAtTime(3200,t+.9);const wg=ac.createGain();wg.gain.setValueAtTime(0,t);wg.gain.linearRampToValueAtTime(.5,t+.5);wg.gain.exponentialRampToValueAtTime(.001,t+1.4);

  fg.gain.setValueAtTime(0,t);fg.gain.linearRampToValueAtTime(.7,t+.8);fg.gain.setValueAtTime(.7,t+dur-.6);fg.gain.linearRampToValueAtTime(0,t+dur+.8);
  f.connect(fl).connect(fg).connect(master);f.start(t);
  /* низкое рычание */
  const lg=ac.createGain(),ll=ac.createBiquadFilter();ll.type='lowpass';ll.frequency.value=180;
  lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(.35,t+1.5);lg.gain.linearRampToValueAtTime(0,t+dur+1.5);ll.connect(lg).connect(master);
  [34.6,35.3,51.9].forEach(fr=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(fr,t);o.frequency.linearRampToValueAtTime(fr*.82,t+dur+1.5);o.connect(ll);o.start(t);o.stop(t+dur+1.6)});
  /* треск */
  const crack=()=>{if(ac.currentTime>t+dur)return;burst(rnd(.01,.04),rnd(.15,.5),rnd(3000,7000),1200);setTimeout(crack,rnd(25,140))};crack();

function burnPaper(ox,oy){
  const paper=cEl.querySelector('.paper'),GW=150,GH=212;

  const cb=mk('burn'),cg=mk('glow'),xb=cb.getContext('2d'),xg=cg.getContext('2d'),ib=xb.createImageData(GW,GH),ig=xg.createImageData(GW,GH);
  const sp=document.createElement('canvas');sp.className='sparks';sp.width=innerWidth;sp.height=innerHeight;cEl.appendChild(sp);const xs=sp.getContext('2d');
  const n1=vnoise(GW,GH,22),n2=vnoise(GW,GH,8),T=new Float32Array(GW*GH);
  const px=ox*GW,py=oy*GH,maxd=Math.hypot(Math.max(px,GW-px),Math.max(py,GH-py));
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){T[y*GW+x]=Math.hypot(x-px,(y-py))/maxd+n1(x,y)*.32+n2(x,y)*.1}

      else if(t<F){const q=(t-(F-edge))/edge;r=255;g=60+q*150;b=10+q*40;a=255;ga=255*(1-Math.abs(q-.55)*1.2);if(Math.random()<.008)emberCells.push(i)}
      else if(t<F+.09){const q=1-(t-F)/.09;r=90;g=50;b=20;a=q*q*170}

    /* искры */
    if(!reduce)for(let j=0;j<Math.min(emberCells.length,6);j++){const i=emberCells[j],x=P.left+(i%GW+.5)/GW*P.width,y=P.top+(Math.floor(i/GW)+.5)/GH*P.height;
      parts.push({x,y,vx:rnd(-.4,.4),vy:rnd(-1.6,-.5),l:1,s:rnd(1,2.6)})}
    xs.clearRect(0,0,sp.width,sp.height);
    for(let j=parts.length-1;j>=0;j--){const p=parts[j];p.x+=p.vx+Math.sin(now/300+j)*.3;p.y+=p.vy;p.vy-=.01;p.l-=.012;
      if(p.l<=0){parts.splice(j,1);continue}xs.fillStyle=`rgba(255,${130+p.l*100|0},40,${p.l})`;xs.beginPath();xs.arc(p.x,p.y,p.s*p.l+.3,0,7);xs.fill()}
    if(k<1)requestAnimationFrame(frame);else crumble(paper,sp,xs,parts);
  }
  requestAnimationFrame(frame);
}
function crumble(paper,sp,xs,parts){
  const P=paper.getBoundingClientRect();
  for(let j=0;j<160&&!reduce;j++)parts.push({x:P.left+Math.random()*P.width,y:P.top+Math.random()*P.height,vx:rnd(-.6,.6),vy:rnd(-1.2,.2),l:1,s:rnd(.8,2.2),ash:Math.random()<.7});
  paper.animate([{opacity:1,scale:1},{opacity:0,scale:.97}],{duration:reduce?1:1600,easing:'ease-in',fill:'forwards'});
  cEl.classList.remove('on');stopDread();
  const t0=performance.now();
  (function f(now){xs.clearRect(0,0,sp.width,sp.height);
    for(let j=parts.length-1;j>=0;j--){const p=parts[j];p.x+=p.vx;p.y+=p.vy;p.vy+=p.ash?.004:-.012;p.l-=.007;if(p.l<=0){parts.splice(j,1);continue}
      xs.fillStyle=p.ash?`rgba(70,64,58,${p.l*.8})`:`rgba(255,${130+p.l*100|0},40,${p.l})`;xs.beginPath();xs.arc(p.x,p.y,p.s,0,7);xs.fill()}
    if(parts.length&&now-t0<6000)requestAnimationFrame(f);else finishDeal(sp)})(t0);
  /* на столе остаётся пепел */
  docs[0].style.display='none';
}
function finishDeal(sp){
  sp.remove();cEl.remove();cEl=null;stampEl&&stampEl.remove();gripEl&&gripEl.remove();
  contractOpen=false;dealing=false;tension(.6);
  thump(.6,.4,44);
}

/* иногда один из листов сдвигается сам */
async function twitchLoop(){
  if(reduce)return;
  while(true){await wait(rnd(11000,20000));if(contractOpen)continue;const i=1+Math.floor(Math.random()*5),p=poses[i],d=docs[i];
    const np={...p,x:p.x+rnd(-7,7),y:p.y+rnd(-5,5),rot:p.rot+rnd(-1.6,1.6)};
    d.animate([{transform:tf(p)},{transform:tf(np)}],{duration:rnd(500,900),easing:'cubic-bezier(.2,.8,.2,1)'});
    d.style.transform=tf(np);poses[i]=np;rustle(.16,.5);}
}
addEventListener('resize',()=>{if(!docs.length)return;const L=layout();poses=poses.map((p,i)=>({...L[i],rot:p.rot}));applyPoses()});
}
